[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saral-document-parser"
version = "0.1.0"
description = "Safe, inspectable Docling parsing service for SARAL"
requires-python = ">=3.9,<4"
dependencies = [
  "celery[redis]==5.6.3",
  "docling==2.69.1",
  "fastapi==0.128.0",
  "langsmith==0.4.37",
  "langgraph==0.6.11",
  "openai==2.48.0",
  "pydantic==2.12.5",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "sentence-transformers==3.3.1",
  "supabase==2.31.0",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.10"]

[project.scripts]
saral-parse = "saral_parser.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.setuptools.packages.find]
where = ["src"]
